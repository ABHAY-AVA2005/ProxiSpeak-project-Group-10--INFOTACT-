services:
  - type: web
    name: proxispeak-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        value: "https://proxi-speak-project-group-10-infota.vercel.app"
