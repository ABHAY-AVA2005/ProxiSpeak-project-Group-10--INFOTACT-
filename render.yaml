services:
  - type: web
    name: proxispeak-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: REDIS_ENABLED
        value: "false"
      - key: CLIENT_URL
        value: "http://localhost:5173"
